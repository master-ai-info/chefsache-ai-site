    <text x="414" y="238" opacity="0.86">EINORDNEN</text>
    <text x="894" y="238" opacity="0.86">ANWENDEN</text>
    <text x="866" y="674" opacity="0.86">TRANSFER</text>
    <text x="408" y="674" opacity="0.86">SCHAERFEN</text>
  </g>

  <g font-family="Cormorant Garamond, Georgia, serif" fill="#EFE3CC">
    <text x="720" y="420" text-anchor="middle" font-size="58" opacity="0.92">Vom Verstehen</text>
    <text x="720" y="477" text-anchor="middle" font-size="58" opacity="0.92">in die Fuehrungspraxis</text>
  </g>

  <g font-family="Geist, Arial, sans-serif" font-size="20" line-height="1.4" fill="#EFE3CC" opacity="0.68">
    <text x="720" y="528" text-anchor="middle">AI wird nicht delegiert. Sie wird zuerst persoenlich erfahren,</text>
    <text x="720" y="558" text-anchor="middle">dann in Entscheidungen, Routinen und Organisation uebersetzt.</text>
  </g>

