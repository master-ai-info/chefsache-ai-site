<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chefsache AI Loop Infografik</title>
  <desc id="desc">Transparente Prozessgrafik fuer Executive AI Coaching: Einordnen, Anwenden, Transferieren, Schaerfen.</desc>
  <defs>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.72 0 0 0 0 0.56 0 0 0 0 0.32 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <linearGradient id="brassStroke" x1="255" y1="696" x2="1133" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7D6847"/>
      <stop offset="0.48" stop-color="#C4A36B"/>
      <stop offset="1" stop-color="#8A7048"/>
    </linearGradient>
    <linearGradient id="ivoryStroke" x1="248" y1="194" x2="1190" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFE3CC" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#FFF5DF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#EFE3CC" stop-opacity="0.34"/>
    </linearGradient>
    <pattern id="pinlines" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M0 26H52M26 0V52" stroke="#EFE3CC" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <g opacity="0.9">
